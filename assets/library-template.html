<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>论文精读库</title>
<style>
:root{--accent:#ed7e7d;--deep:#c73b41;--light:#f5b7ab;--tint:#fdf6f4;--ink:#423f3d;--soft:#6e655e;--faint:#8d837b;--rule:#eee8e4;--rule2:#f5f0ec;--bg:#fff;--paper:#fdfcfb;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--serif:"Noto Serif SC","Songti SC",Georgia,serif;--mono:Consolas,"SFMono-Regular",monospace}body[data-accent=green]{--accent:#6fbf92;--deep:#1f7a4f;--light:#b6dfc4;--tint:#f1faf4}body[data-accent=blue]{--accent:#6ba6d4;--deep:#286ba3;--light:#afd2ec;--tint:#f1f7fc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}.progress{position:fixed;left:0;top:0;width:0;height:2px;background:var(--accent);z-index:100}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:auto;padding:0 28px;border-bottom:1px solid var(--rule)}.brand,.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:650}.brand b,.eyebrow{color:var(--deep)}.tools,.dots,.actions,.controls,.stats,.tags{display:flex;align-items:center;gap:10px}.dot{width:14px;height:14px;border-radius:50%;border:0;background:var(--c);cursor:pointer;outline:1px solid var(--rule);outline-offset:2px}.dot[aria-pressed=true]{outline-color:var(--c);outline-width:2px}.plain,.primary,.ghost{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.plain{border:0;background:none;color:var(--faint);padding:8px}.primary,.ghost{padding:10px 13px;border:1px solid var(--deep);text-decoration:none}.primary{background:var(--deep);color:#fff}.ghost{background:#fff;color:var(--deep)}.page{max-width:1120px;margin:auto;padding:58px 28px 90px}.hero{padding-bottom:34px;border-bottom:1px solid var(--rule)}h1{font-size:clamp(32px,5vw,52px);line-height:1.12;letter-spacing:-.025em;margin:14px 0 12px}h2{font-size:25px;line-height:1.32;margin:0}h3{font-size:19px;line-height:1.4;margin:26px 0 8px}.lead{max-width:720px;color:var(--soft);font-size:16px}.stats{flex-wrap:wrap;gap:22px;margin-top:26px;color:var(--faint);font-size:12px}.stats span:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px}.stats b{color:var(--ink);font-family:var(--mono)}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:46px 0 18px}.controls{flex-wrap:wrap}.search,.select{border:1px solid var(--rule);background:#fff;color:var(--soft);font:13px var(--sans);padding:9px 11px}.search{min-width:230px}.switch{display:flex;border:1px solid var(--rule)}.switch button{border:0;border-right:1px solid var(--rule);background:#fff;color:var(--faint);padding:9px 12px;cursor:pointer}.switch button:last-child{border-right:0}.switch button.active{color:#fff;background:var(--deep)}.collection{border:1px solid var(--rule)}.collection-title{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--soft)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px}.card{border:1px solid var(--rule);padding:21px;background:#fff;transition:.18s}.card:hover{border-color:var(--light);background:var(--tint)}.status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}.card-title{font-size:18px;line-height:1.48;font-weight:650;margin:12px 0 8px;cursor:pointer}.card-title:hover{color:var(--deep)}.card-subtitle-zh{font-size:12.5px;font-weight:400;color:var(--soft);margin-top:5px;line-height:1.45}.table-subtitle-zh{font-size:12px;font-weight:400;color:var(--soft);margin-top:4px;line-height:1.4}.paper-title-zh{font-size:19px;font-weight:500;color:var(--soft);margin-top:8px;margin-bottom:14px;line-height:1.4;font-family:var(--sans)}.meta{color:var(--faint);font-size:12px}.tags{flex-wrap:wrap;margin:14px 0}.tag{font-size:10px;color:var(--soft);border:1px solid var(--rule);padding:2px 7px}.actions{margin-top:18px}.actions>*{flex:1;text-align:center}.paper-table,.analysis-table{width:100%;border-collapse:collapse}.paper-table th,.paper-table td,.analysis-table th,.analysis-table td{padding:11px 13px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}.paper-table th,.analysis-table th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--paper)}.paper-table tr:hover td{background:var(--tint)}.link-button{border:0;background:none;color:var(--deep);font:inherit;text-align:left;cursor:pointer}.empty{padding:50px;text-align:center;color:var(--faint)}.dashboard.hidden,.detail{display:none}.detail.active{display:block}.detail-head{border-bottom:1px solid var(--rule);padding-bottom:30px}.back{border:0;background:none;color:var(--deep);padding:0;margin-bottom:30px;cursor:pointer}.paper-title{font:600 clamp(30px,4.2vw,46px)/1.25 var(--serif);max-width:920px}.paper-meta{color:var(--soft)}.detail-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.reader{display:grid;grid-template-columns:180px minmax(0,720px) 230px;gap:36px;margin-top:44px;align-items:start}.toc,.notes{position:sticky;top:24px}.side-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--deep);font-weight:700;margin-bottom:12px}.toc a,.resource{display:block;padding:7px 0;border-bottom:1px solid var(--rule2);color:var(--faint);font-size:12px;text-decoration:none}.toc a:hover,.toc a.active,.resource:hover{color:var(--deep)}.article>section{scroll-margin-top:28px;padding-bottom:35px;margin-bottom:35px;border-bottom:1px solid var(--rule)}.article p{margin:12px 0}.article ul,.article ol{padding-left:22px}.article li+li{margin-top:6px}.article blockquote{margin:18px 0;padding:18px 20px;border-left:3px solid var(--accent);background:var(--tint);font-weight:600}.article code{background:var(--rule2);padding:1px 4px}.article a{color:var(--deep)}.section-num{display:inline-block;color:var(--deep);font:600 11px var(--mono);margin-bottom:8px}.table-wrap{overflow:auto;border:1px solid var(--rule);margin:16px 0}.analysis-table{font-size:13px;min-width:620px}.notes textarea{width:100%;min-height:240px;resize:vertical;border:1px solid var(--rule71);border:1px solid var(--rule);background:var(--paper);padding:12px;color:var(--ink);font:13px/1.7 var(--sans)}.save-state{font-size:11px;color:var(--faint);margin-top:7px}.modal{position:fixed;inset:0;background:rgba(40,35,33,.84);z-index:300;display:none;padding:26px}.modal.open{display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;gap:14px}.modal-head h2{font-size:17px}.modal-actions{display:flex;gap:8px}.modal-actions a,.modal-actions button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;padding:8px 11px;text-decoration:none;cursor:pointer}.map-stage{width:100%;height:calc(100vh - 90px);overflow:auto;background:#fff;text-align:center}.map-stage img{display:block;width:900px;max-width:none;height:auto;margin:20px auto;transition:width .16s}.foot{border-top:1px solid var(--rule);margin-top:58px;padding-top:24px;color:var(--faint);font-size:11px}@media(max-width:960px){.reader{grid-template-columns:1fr}.toc,.notes{position:static}.toc{display:none}.notes{border-top:1px solid var(--rule);padding-top:24px}}@media(max-width:650px){.topbar{padding:0 18px}.page{padding:38px 18px 70px}.brand-label{display:none}.section-head{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.modal{padding:10px}.modal-head h2{display:none}.map-stage{height:calc(100vh - 64px)}}@media print{.topbar,.controls,.actions,.detail-actions,.toc,.notes,.modal{display:none!important}.dashboard{display:none!important}.detail{display:block!important}.reader{display:block}.page{padding:0}}
</style>
</head>
<body data-accent="rose"><div class="progress" id="progress"></div>
<header class="topbar"><div class="brand">Reading Library · <b id="topCount"></b></div><div class="tools"><span class="brand brand-label">Theme</span><div class="dots"><button class="dot" data-theme="rose" style="--c:#ed7e7d" aria-label="玫瑰色主题"></button><button class="dot" data-theme="green" style="--c:#6fbf92" aria-label="绿色主题"></button><button class="dot" data-theme="blue" style="--c:#6ba6d4" aria-label="蓝色主题"></button></div><button class="plain" id="homeTop">论文库</button></div></header>
<main class="page"><div class="dashboard" id="dashboard"><section class="hero"><div class="eyebrow">Literature Dashboard</div><h1 id="libraryTitle"></h1><p class="lead">集中管理完整论文分析、原始 Markdown 与本地生成的思维导图。论文内容保存在本地文件中。</p><div class="stats" id="stats"></div></section><div class="section-head"><div><div class="eyebrow">Collections</div><h2>全部论文</h2></div><div class="controls"><input id="search" class="search" placeholder="搜索标题、作者或关键词"><select id="sort" class="select"><option value="recent">最近整理</option><option value="year">发表年份</option><option value="title">标题</option></select><div class="switch"><button class="active" data-view="card">卡片</button><button data-view="table">表格</button></div></div></div><div class="collection"><div class="collection-title"><span>Paper Collection</span><span id="resultCount"></span></div><div id="papers"></div></div><footer class="foot" id="foot"></footer></div><article class="detail" id="detail"></article></main>
<div class="modal" id="mindmap" role="dialog" aria-modal="true" aria-label="论文思维导图"><div class="modal-head"><h2 id="mapTitle"></h2><div class="modal-actions"><button id="zoomOut" aria-label="缩小思维导图">−</button><button id="zoomReset">100%</button><button id="zoomIn" aria-label="放大思维导图">＋</button><a id="mapDirect" target="_blank">新窗口打开</a><button id="closeMap">关闭 Esc</button></div></div><div class="map-stage"><img id="mapImage" alt="论文思维导图"></div></div>
<script>
const DATA=__LIBRARY_JSON__,all=DATA.papers||[],dashboard=document.getElementById('dashboard'),detail=document.getElementById('detail'),papersEl=document.getElementById('papers'),modal=document.getElementById('mindmap');let view='card',current=null,mapWidth=900;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const statusLabel=s=>s==='reading'?'阅读中':s==='archived'?'已归档':'已分析';
const pTitles=p=>{let orig=p.title||'',zh=p.title_zh||'';if(!zh&&p.title_en&&p.title!==p.title_en){if(/[\u4e00-\u9fff]/.test(p.title)){orig=p.title_en;zh=p.title}}return{orig,zh}};
document.title=DATA.title||'论文精读库';document.getElementById('libraryTitle').textContent=DATA.title||'论文精读库';document.getElementById('topCount').textContent=all.length+' Papers';document.getElementById('foot').textContent='LOCAL PAPER LIBRARY · '+(DATA.generated_at||'')+' · 内容与笔记均保存在本机';
function stats(){const done=all.filter(p=>p.status==='done').length,maps=all.filter(p=>p.mindmap_svg).length,refs=all.reduce((n,p)=>n+(Number(p.references_count)||0),0);document.getElementById('stats').innerHTML=`<span>论文 <b>${all.length}</b></span><span>已分析 <b>${done}</b></span><span>参考文献 <b>${refs}</b></span><span>思维导图 <b>${maps}</b></span>`}stats();
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),mode=document.getElementById('sort').value;let list=all.filter(p=>{const{orig,zh}=pTitles(p);return(orig+' '+zh+' '+(p.title_en||'')+' '+p.authors_text+' '+(p.tags||[]).join(' ')).toLowerCase().includes(q)});list.sort((a,b)=>mode==='year'?String(b.year).localeCompare(String(a.year)):mode==='title'?(pTitles(a).orig).localeCompare(pTitles(b).orig,'zh-CN'):String(b.date||b.year).localeCompare(String(a.date||a.year)));return list}
function render(){const list=filtered();document.getElementById('resultCount').textContent=list.length+' papers';if(!list.length){papersEl.innerHTML='<div class="empty">没有匹配论文</div>';return}if(view==='table'){papersEl.innerHTML='<table class="paper-table"><thead><tr><th>标题</th><th>作者</th><th>年份</th><th>状态</th><th>附件</th></tr></thead><tbody>'+list.map(p=>{const{orig,zh}=pTitles(p),zhHtml=zh?`<div class="table-subtitle-zh">${esc(zh)}</div>`:'';return`<tr><td><button class="link-button open-paper" data-slug="${esc(p.slug)}">${esc(orig)}</button>${zhHtml}</td><td>${esc(p.authors_text)}</td><td>${esc(p.year)}</td><td>${statusLabel(p.status)}</td><td><button class="link-button open-map" data-slug="${esc(p.slug)}">思维导图</button></td></tr>`}).join('')+'</tbody></table>'}else{papersEl.innerHTML='<div class="grid">'+list.map(p=>{const{orig,zh}=pTitles(p),zhHtml=zh?`<div class="card-subtitle-zh">${esc(zh)}</div>`:'';return`<article class="card"><span class="status">${statusLabel(p.status)}</span><div class="card-title open-paper" data-slug="${esc(p.slug)}">${esc(orig)}${zhHtml}</div><div class="meta">${esc(p.authors_text)} · ${esc(p.year)}${p.venue?' · '+esc(p.venue):''}</div><div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">${Number(p.references_count)||0} 篇参考文献</div><div class="actions"><button class="ghost open-paper" data-slug="${esc(p.slug)}">查看分析</button><button class="primary open-map" data-slug="${esc(p.slug)}">思维导图</button></div></article>`}).join('')+'</div>'}wire()}
function paperBySlug(slug){return all.find(p=>p.slug===slug)}function openPaper(slug){const p=paperBySlug(slug);if(!p)return;current=p;const{orig,zh}=pTitles(p),zhHtml=zh?`<div class="paper-title-zh">${esc(zh)}</div>`:'';detail.innerHTML=`<header class="detail-head"><button class="back" id="back">← 返回论文库</button><div class="eyebrow">${esc(statusLabel(p.status))} · ${esc(p.year)}</div><h1 class="paper-title">${esc(orig)}</h1>${zhHtml}<p class="paper-meta">${esc(p.authors_text)}${p.venue?' · '+esc(p.venue):''}${p.doi?' · DOI '+esc(p.doi):''}</p><div class="detail-actions"><button class="primary open-map" data-slug="${esc(p.slug)}">查看思维导图</button><a class="ghost" href="${esc(p.analysis_md)}">分析 Markdown</a>${p.mindmap_md?`<a class="ghost" href="${esc(p.mindmap_md)}">导图 Markdown</a>`:''}<a class="ghost" href="${esc(p.mindmap_svg)}">导图 SVG</a></div></header><div class="reader"><nav class="toc"><div class="side-label">On this page</div>${(p.toc||[]).map(x=>`<a href="#${esc(x.id)}">${esc(x.title)}</a>`).join('')}</nav><div class="article">${p.analysis_html}</div><aside class="notes"><div class="side-label">Personal Notes</div><textarea id="note" placeholder="写下你的判断、疑问或可复用方法……"></textarea><div class="save-state" id="saveState">自动保存在本机</div><div class="side-label" style="margin-top:28px">Resources</div><a class="resource open-map" data-slug="${esc(p.slug)}" href="#">思维导图预览 →</a><a class="resource" href="${esc(p.analysis_md)}">分析 Markdown →</a><a class="resource" href="${esc(p.mindmap_svg)}">导 wrap SVG9050</a${''}</a></aside></div>`;
/* Repair the deliberately compact resource label without changing generated paths. */detail.querySelector('.resource[href$=".svg"]').textContent='导图 SVG →';
dashboard.classList.add('hidden');detail.classList.add('active');scrollTo(0,0);history.replaceState(null,'','#paper='+encodeURIComponent(slug));detail.querySelector('#back').onclick=showHome;const note=detail.querySelector('#note'),state=detail.querySelector('#saveState'),key='chatpaper-library:note:'+p.slug;note.value=localStorage.getItem(key)||'';let timer;note.oninput=()=>{state.textContent='正在保存…';clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(key,note.value);state.textContent='已保存在本机'},350)};wire();wireToc()}
function showHome(){detail.classList.remove('active');dashboard.classList.remove('hidden');current=null;scrollTo(0,0);history.replaceState(null,'',location.pathname)}function openMap(slug,e){if(e)e.preventDefault();const p=paperBySlug(slug);if(!p)return;const{orig}=pTitles(p);document.getElementById('mapTitle').textContent=orig+' · 思维导图';document.getElementById('mapImage').src=p.mindmap_svg;document.getElementById('mapDirect').href=p.mindmap_svg;modal.classList.add('open');document.body.style.overflow='hidden';setZoom(mapWidth)}function closeMap(){modal.classList.remove('open');document.body.style.overflow=''}function setZoom(w){mapWidth=Math.max(320,Math.min(2200,w));document.getElementById('mapImage').style.width=mapWidth+'px';document.getElementById('zoomReset').textContent=Math.round(mapWidth/900*100)+'%'}
function wire(){document.querySelectorAll('.open-paper').forEach(x=>x.onclick=()=>openPaper(x.dataset.slug));document.querySelectorAll('.open-map').forEach(x=>x.onclick=e=>openMap(x.dataset.slug,e))}function wireToc(){const links=[...detail.querySelectorAll('.toc a')],sections=[...detail.querySelectorAll('.article>section')];const spy=()=>{let active=sections[0];sections.forEach(s=>{if(s.getBoundingClientRect().top<170)active=s});links.forEach(a=>a.classList.toggle('active',active&&a.hash==='#'+active.id))};addEventListener('scroll',spy,{passive:true});spy()}
document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('homeTop').onclick=showHome;document.getElementById('closeMap').onclick=closeMap;document.getElementById('zoomIn').onclick=()=>setZoom(mapWidth+180);document.getElementById('zoomOut').onclick=()=>setZoom(mapWidth-180);document.getElementById('zoomReset').onclick=()=>setZoom(900);modal.onclick=e=>{if(e.target===modal)closeMap()};addEventListener('keydown',e=>{if(e.key==='Escape')closeMap()});document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{document.body.dataset.accent=b.dataset.theme;localStorage.setItem('chatpaper-library:theme',b.dataset.theme);setDots()});function setDots(){document.querySelectorAll('.dot').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===document.body.dataset.accent))}document.body.dataset.accent=localStorage.getItem('chatpaper-library:theme')||'rose';setDots();addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(h>0?scrollY/h*100:0)+'%'},{passive:true});
render();const initial=decodeURIComponent((location.hash.match(/^#paper=(.+)$/)||[])[1]||'');if(initial)openPaper(initial);
</script></body></html>
